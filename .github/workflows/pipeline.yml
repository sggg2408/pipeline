name: challenge2

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run the script
        run: python hello.py

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello
          path: .
